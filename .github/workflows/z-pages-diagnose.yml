name: Diagnose GitHub Pages

# 临时诊断工作流：通过 GitHub 自身的 API 读取 Pages 状态与证书信息。
# 结果写入 pages-report.json 并提交回仓库，供本地读取。
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/z-pages-diagnose.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Query Pages API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          echo "repo=$REPO"
          curl -sS -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               -H "X-GitHub-Api-Version: 2022-11-28" \
               -w "\nHTTP_STATUS=%{http_code}\n" \
               "https://api.github.com/repos/$REPO/pages" -o pages-raw.json || true
          echo "--- raw ---"
          cat pages-raw.json || true

      - name: Build report
        run: |
          python3 - <<'PY'
import json
try:
    d = json.load(open('pages-raw.json'))
except Exception as e:
    d = {"_parse_error": str(e)}
report = {
    "cname": d.get("cname"),
    "status": d.get("status"),
    "html_url": d.get("html_url"),
    "build_type": d.get("build_type"),
    "https_enforced": d.get("https_enforced"),
    "public": d.get("public"),
    "source": d.get("source"),
    "https_certificate": d.get("https_certificate"),
    "raw_keys": sorted(d.keys()) if isinstance(d, dict) else None,
    "message": d.get("message") if isinstance(d, dict) else None,
}
with open('pages-report.json', 'w') as f:
    json.dump(report, f, ensure_ascii=False, indent=2)
print(json.dumps(report, ensure_ascii=False, indent=2))
PY

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages-report.json
          git commit -m "chore: pages api report [skip ci]" || echo "nothing to commit"
          git push
