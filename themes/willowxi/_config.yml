# WillowXI theme
# All display text is intentionally short because the UI uses an editorial,
# terminal-like visual language.

menu:
  INDEX: /
  ARCHIVE: /archives/

identity:
  name: WillowXI
  mark: W
  # The face on the "关于我" controls (header button + home hero button).
  # Leave empty to fall back to the line-art user icon.
  avatar: /images/avatar.jpg
  eyebrow: PHOTOGRAPHY / LIFE / CODE
  tagline: 'さぁ下剋上、自分を越えていけ！'
  description: '记录光影、AI 与编程，也收录仍在生长的日常。'
  location: CN / BEIJING
  status: ONLINE

# The full-screen sequence is shown on the home page. Visitors can skip it
# anywhere, and the home page also keeps a direct entry control.
intro:
  enabled: true
  duration: 5900

# The desktop scene is a fixed wallpaper, a heavy acrylic layer, and a
# transparent-grid canvas. Mobile keeps the wallpaper and acrylic, but draws
# the original flat grid without the tunnel animation.
# reveal_*: after each page transition the scene fades in over reveal_duration
# seconds; the light band then waits sweep_delay seconds before sweeping.
# parallax_*: pointer parallax amplitudes in px — a larger gap between the
# wallpaper and the grid reads as stronger depth.
background:
  wallpaper: /images/wallpaper/wallpaper-default.webp
  desktop_min_width: 769
  grid_spacing: 168
  mobile_grid_spacing: 42
  reveal_delay: 0
  reveal_duration: 1
  sweep_delay: 1
  sweep_duration: 4
  # Wallpaper parallax is deliberately twice the grid's amplitude.
  parallax_wallpaper: 28
  parallax_wallpaper_y: 28
  parallax_grid: 7

home:
  direct_entry: '直接进入文章'
  stream_title: 'SIGNAL GROUPS'
  stream_description: '按主题折叠整理。选择一组，展开阅读。'

post:
  excerpt_length: 118
  toc: true

footer:
  since: 2026
  notice: 'WILLOWXI / PERSONAL ARCHIVE'

# Friend links shown on the About page. Copy a block to add one.
friends:
  - name: 北杉札记
    url: https://northcedar.top
    desc: '随笔、照片，和用 AI 折腾项目的经历'
    avatar: https://northcedar.top/favicon.ico

# Waline comment system (https://waline.js.org). The client is self-hosted in
# source/vendor/waline/. Leave serverURL empty to hide comments everywhere.
# Fill in the Vercel server URL after deployment, e.g.
#   serverURL: https://comment.willowxi.site
waline:
  serverURL: 'https://comment.willowxi.site'
